  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--shopee:#EE4D2D;--shopee-dark:#D73211;--bg:#F5F5F5;--card:#fff;--text:#222;--muted:#888;--r:10px}
    body{font-family:'Poppins',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
    header{background:var(--shopee);color:#fff;padding:18px 16px 14px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(238,77,45,.3)}
    .logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
    .shopee-logo{width:32px;height:32px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px}
    header h1{font-size:1.15rem;font-weight:700;line-height:1.2}
    header .handle{font-size:.78rem;opacity:.85;margin-bottom:10px}
    .search-wrap{background:var(--shopee);padding:0 12px 14px}
    .search-box{display:flex;align-items:center;background:#fff;border-radius:20px;padding:8px 14px;gap:8px}
    .search-box svg{flex-shrink:0;color:var(--shopee)}
    .search-box input{border:none;outline:none;font-family:inherit;font-size:.9rem;width:100%;color:var(--text);background:transparent}
    .search-box input::placeholder{color:#bbb}
    .counter{text-align:center;font-size:.78rem;color:var(--muted);padding:10px 16px 0}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 10px 6px}
    @media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr);gap:14px;padding:14px 16px 8px;max-width:1100px;margin:0 auto}}
    .card{background:var(--card);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
    .card:active{transform:scale(.97)}
    @media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.12)}}
    .card-img{width:100%;aspect-ratio:1;object-fit:cover;background:#f0f0f0;display:block}
    .card-body{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;gap:6px}
    .card-name{font-size:.75rem;line-height:1.4;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .card-btn{display:block;text-align:center;background:var(--shopee);color:#fff;font-size:.72rem;font-weight:700;padding:7px 8px;border-radius:6px}
    .empty{display:none;flex-direction:column;align-items:center;padding:48px 24px;color:var(--muted);font-size:.9rem;gap:8px}
    .empty svg{opacity:.3}
    .pagination{display:flex;justify-content:center;align-items:center;gap:6px;padding:16px 12px 24px;flex-wrap:wrap}
    .page-btn{min-width:36px;height:36px;border:1.5px solid #ddd;border-radius:8px;background:#fff;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--text);padding:0 8px;transition:background .15s,border-color .15s,color .15s}
    .page-btn:hover{border-color:var(--shopee);color:var(--shopee)}
    .page-btn.active{background:var(--shopee);border-color:var(--shopee);color:#fff}
    .page-btn:disabled{opacity:.35;cursor:not-allowed}
    footer{text-align:center;padding:0 16px 32px;font-size:.72rem;color:var(--muted)}
    footer a{color:var(--shopee);text-decoration:none}
  </style>
</head>

const PER=20;
let q='',pg=1;
function f(){return q?P.filter(p=>p.nome.toLowerCase().includes(q.toLowerCase())):P}
function render(){
  const list=f(),tot=list.length,pages=Math.max(1,Math.ceil(tot/PER));
  if(pg>pages)pg=pages;
  const sl=list.slice((pg-1)*PER,pg*PER);
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  const ctr=document.getElementById('counter');
  if(!sl.length){grid.innerHTML='';empty.style.display='flex';ctr.textContent='';return;}
  empty.style.display='none';
  ctr.textContent=tot===P.length?tot+' produtos':tot+' resultado'+(tot!==1?'s':'');
  grid.innerHTML=sl.map(p=>'<a href="'+p.link+'" target="_blank" rel="noopener" class="card"><img class="card-img" src="'+(p.img||p.img2)+'" onerror="this.src=\''+p.img2+'\';this.onerror=null;" alt="'+p.nome.replace(/"/g,'&quot;')+'" loading="lazy"/><div class="card-body"><p class="card-name">'+p.nome+'</p><span class="card-btn">Ver na Shopee →</span></div></a>').join('');
  const pag=document.getElementById('pagination');
  if(pages<=1){pag.innerHTML='';return;}
  let h='<button class="page-btn" onclick="gp('+(pg-1)+')" '+(pg===1?'disabled':'')+'>‹</button>';
  for(let i=1;i<=pages;i++){
    if(pages>7&&Math.abs(i-pg)>2&&i!==1&&i!==pages){if(i===pg-3||i===pg+3)h+='<span style="padding:0 4px;color:#bbb">…</span>';continue;}
    h+='<button class="page-btn '+(i===pg?'active':'')+'" onclick="gp('+i+')">'+i+'</button>';
  }
  h+='<button class="page-btn" onclick="gp('+(pg+1)+')" '+(pg===pages?'disabled':'')+'>›</button>';
  pag.innerHTML=h;
}
window.gp=function(p){pg=p;render();window.scrollTo({top:0,behavior:'smooth'});};
document.getElementById('search').addEventListener('input',function(e){q=e.target.value.trim();pg=1;render();});
render();
})();
