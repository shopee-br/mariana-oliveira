<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#EE4D2D"/>
  <title>Mariana Oliveira — Achadinhos Shopee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --shopee: #EE4D2D;
      --shopee-dark: #D73211;
      --shopee-light: #FFF3F0;
      --text: #222;
      --text-muted: #888;
      --bg: #F5F5F5;
      --card-bg: #fff;
      --radius: 10px;
    }
    body {
      font-family: 'Poppins', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ── */
    header {
      background: var(--shopee);
      color: #fff;
      padding: 20px 16px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(238,77,45,0.3);
    }
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .shopee-logo {
      width: 28px; height: 28px;
      background: #fff;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .shopee-logo svg { width: 20px; height: 20px; }
    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.2;
    }
    header .handle {
      font-size: 0.78rem;
      opacity: 0.85;
      margin-bottom: 12px;
    }

    /* ── Search ── */
    .search-wrap {
      background: var(--shopee);
      padding: 0 12px 14px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 20px;
      padding: 8px 14px;
      gap: 8px;
    }
    .search-box svg { flex-shrink: 0; color: var(--shopee); }
    .search-box input {
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 0.9rem;
      width: 100%;
      color: var(--text);
      background: transparent;
    }
    .search-box input::placeholder { color: #bbb; }

    /* ── Counter ── */
    .counter {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 10px 16px 0;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px 10px 6px;
    }
    @media (min-width: 480px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 14px 16px 8px; max-width: 1100px; margin: 0 auto; }
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:active { transform: scale(0.97); }
    @media (hover: hover) {
      .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    }
    .card-img {
      width: 100%; aspect-ratio: 1;
      object-fit: cover;
      background: #f0f0f0;
      display: block;
    }
    .card-body {
      padding: 8px 10px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-name {
      font-size: 0.75rem;
      line-height: 1.4;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-btn {
      display: block;
      text-align: center;
      background: var(--shopee);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 7px 8px;
      border-radius: 6px;
      letter-spacing: 0.2px;
    }

    /* ── Empty state ── */
    .empty {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      color: var(--text-muted);
      font-size: 0.9rem;
      gap: 8px;
    }
    .empty svg { opacity: 0.3; }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 16px 12px 24px;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 36px; height: 36px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      padding: 0 8px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .page-btn:hover { border-color: var(--shopee); color: var(--shopee); }
    .page-btn.active {
      background: var(--shopee);
      border-color: var(--shopee);
      color: #fff;
    }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 0 16px 32px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    footer a { color: var(--shopee); text-decoration: none; }
  </style>
</head>

  const PER_PAGE = 20;
  let query = '';
  let page  = 1;

  function filtered() {
    if (!query) return PRODUTOS;
    const q = query.toLowerCase();
    return PRODUTOS.filter(p => p.nome.toLowerCase().includes(q));
  }

  function render() {
    const list  = filtered();
    const total = list.length;
    const pages = Math.max(1, Math.ceil(total / PER_PAGE));
    if (page > pages) page = pages;

    const slice = list.slice((page - 1) * PER_PAGE, page * PER_PAGE);

    const grid  = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const ctr   = document.getElementById('counter');

    if (slice.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'flex';
      ctr.textContent = '';
    } else {
      empty.style.display = 'none';
      ctr.textContent = total === PRODUTOS.length
        ? total + ' produtos'
        : total + ' resultado' + (total !== 1 ? 's' : '');

      grid.innerHTML = slice.map(p => `
        <a href="${p.link}" target="_blank" rel="noopener" class="card">
          <img class="card-img" src="${p.img}"
               onerror="this.src='${p.img2}';this.onerror=null;"
               alt="${p.nome.replace(/"/g,'&quot;')}" loading="lazy"/>
          <div class="card-body">
            <p class="card-name">${p.nome}</p>
            <span class="card-btn">Ver na Shopee →</span>
          </div>
        </a>`).join('');
    }

    // Paginação
    const pag = document.getElementById('pagination');
    if (pages <= 1) { pag.innerHTML = ''; return; }

    let html = `<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
    for (let i = 1; i <= pages; i++) {
      if (pages > 7 && Math.abs(i - page) > 2 && i !== 1 && i !== pages) {
        if (i === page - 3 || i === page + 3) html += '<span style="padding:0 4px;color:#bbb">…</span>';
        continue;
      }
      html += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    html += `<button class="page-btn" onclick="goPage(${page+1})" ${page===pages?'disabled':''}>›</button>`;
    pag.innerHTML = html;
  }

  window.goPage = function(p) {
    page = p;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  document.getElementById('search').addEventListener('input', function(e) {
    query = e.target.value.trim();
    page  = 1;
    render();
  });

  render();
})();
</script>
</body>
</html>
